[project]
name = "equipment-mcp"
version = "0.1.0"
description = "Internal IT equipment request handler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1,<2",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "sqlmodel>=0.0.24,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.6,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
server = ["sql/*.sql"]
