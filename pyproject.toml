[project]
name = "equipment-mcp"
version = "0.1.0"
description = "Internal IT equipment request handler"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
